name: Auto Merge Dependabot PRs

# 只保留 pull_request_target 一个触发源。
# 不监听 check_suite / workflow_run，避免"任意 workflow 完成"反复触发同一 PR，
# 导致 auto-merge（含 approve）被重复执行多次。
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

# 同一 PR 的多次触发合并为一个并发组，防止并发运行重复 approve/merge。
concurrency:
  group: auto-merge-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 判断本次 PR 是否已由本 bot（github-actions）批准过；
      # 已批准则跳过，避免对同一 PR 重复 approve。
      - name: Approve Dependabot PR (idempotent)
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          ALREADY=$(gh pr view "$PR_URL" --json reviews --jq '[.reviews[] | select(.author.login == "github-actions" and .state == "APPROVED")] | length')
          if [ "$ALREADY" -eq 0 ]; then
            gh pr review "$PR_URL" --approve
          else
            echo "Already approved by github-actions, skip."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 判断本次 PR 是否改了 react-ts / vue-ts 的应用依赖。
      # 只有改了这些目录才需要执行 build/test 校验；
      # 仅更新 GitHub Actions（.github/**）时跳过校验直接合并。
      - name: Detect app dependency changes
        id: build-changed
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          FILES=$(gh pr view "$PR_URL" --json files --jq '.files[].path')
          CHANGED=false
          if echo "$FILES" | grep -qE '^(react-ts|vue-ts)/'; then
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 等待并核对依赖更新涉及的 build / test 检查是否全部通过。
      # 未改动的 workspace 其 check 为空跑成功，因此统一校验这四个 check 全成功。
      # 注意：不能用 `gh pr checks --watch`——它会把本 workflow 自身的 auto-merge
      # check（永远处于 pending）也算进去，导致自我等待死锁直至 6h 超时。
      # 改为用 gh api 轮询，并显式排除名为 "auto-merge" 的 check。
      - name: Wait for and verify required checks
        if: steps.build-changed.outputs.changed == 'true'
        id: checks
        run: |
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # 轮询直到要求的 4 个 check 全部成功；失败或超时（10min）则退出。
          # 只统计这 4 个 check 名，auto-merge 自身（永远 pending）天然不在其中，
          # 因此不会像 `gh pr checks --watch` 那样自我等待死锁。
          for i in $(seq 1 20); do
            NAMES=$(gh api "/repos/$REPO/commits/$HEAD_SHA/check-runs" --jq '
              [.check_runs[]
               | select(.name | IN("react-ts build", "react-ts test", "vue-ts build", "vue-ts test"))
               | {name, status, conclusion}]')

            COUNT=$(echo "$NAMES" | jq 'length')
            SUCCESS=$(echo "$NAMES" | jq '[.[] | select(.conclusion == "success")] | length')
            FAILED=$(echo "$NAMES" | jq '[.[] | select(.conclusion != "success" and .conclusion != null)] | length')
            PENDING=$(echo "$NAMES" | jq '[.[] | select(.conclusion == null or .status == "in_progress" or .status == "queued")] | length')

            echo "checks: count=$COUNT success=$SUCCESS failed=$FAILED pending=$PENDING"
            if [ "$SUCCESS" -eq 4 ]; then
              echo "required-checks-state=passed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 4 个 check 尚未全部创建（workflow 刚被触发，check 还在排队/未上报），
            # 不能判定失败，应继续等待。
            if [ "$COUNT" -lt 4 ]; then
              sleep 30
              continue
            fi
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::One or more required checks failed."
              echo "required-checks-state=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$PENDING" -eq 0 ]; then
              echo "::error::Required checks finished but not all passed."
              echo "required-checks-state=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for required checks."
          echo "required-checks-state=failed" >> "$GITHUB_OUTPUT"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 依赖更新通过校验，或仅 actions 更新（无需构建）时自动合并。
      - name: Merge Dependabot PR
        if: steps.build-changed.outputs.changed == 'false' || steps.checks.outputs.required-checks-state == 'passed'
        run: gh pr merge "$PR_URL" --squash --auto
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
